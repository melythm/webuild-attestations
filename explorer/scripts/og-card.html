<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Graph card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box;
    background: linear-gradient(90deg, #003399 4.59%, #001d58 36.48%);
    color: #fff; font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
    padding: 74px 80px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; right: -150px; bottom: -220px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,204,0,.17), rgba(255,204,0,0) 68%);
  }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { height: 62px; display: block; }
  .rule { width: 1px; height: 44px; background: rgba(255,255,255,.3); }
  .eyebrow {
    font-size: 21px; font-weight: 500; letter-spacing: .01em; color: rgba(255,255,255,.88);
  }
  h1 {
    margin: 0; font-size: 76px; line-height: 1.04; font-weight: 700;
    letter-spacing: -.028em; max-width: 880px;
  }
  h1 .accent { color: #ffcc00; }
  p { margin: 22px 0 0; font-size: 26px; line-height: 1.4; color: rgba(255,255,255,.86); max-width: 820px; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
  .chip {
    font-family: 'JetBrains Mono', monospace; font-size: 19px;
    padding: 9px 18px; border-radius: 980px;
    background: rgba(255,255,255,.13); color: #fff;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <img src="../assets/logo.svg" alt="">
    <span class="rule"></span>
    <span class="eyebrow">Attestation Rulebook Explorer</span>
  </div>
  <div>
    <h1>Every attestation rulebook,<br><span class="accent">searchable</span>.</h1>
    <p>Search by category, by format or by attribute, then read the rulebook in full.</p>
  </div>
  <div class="chips">
    <span class="chip">PID</span>
    <span class="chip">EBWOID</span>
    <span class="chip">QEAA</span>
    <span class="chip">PuB-EAA</span>
    <span class="chip">EAA</span>
    <span class="chip">SD-JWT VC</span>
    <span class="chip">mdoc</span>
  </div>
</div>
</body>
</html>
